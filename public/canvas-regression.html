      if (best < 0 && current.length) { flush(); continue; }
      if (best < 0) {
        // Long unbroken words must wrap without splitting a Hindi grapheme.
        points = boundaries(remaining, true);
        findSplit();
      }
      if (best < 0) { current.push(remaining); break; }
      const [a, b] = parts(remaining, points[best]);
      if (!b.textContent && !b.querySelector('br')) { current.push(remaining); break; }
      current.push(a); flush(); remaining = b;
    }
    if (breakAfter) flush();
  }
  try { [...source.childNodes].forEach(append); flush(); return pages.length ? pages : ['']; }
  finally { box.remove(); }
}

const ALLOWED_TAGS = new Set([
  "A",
  "B",
  "BLOCKQUOTE",
  "BR",
  "DIV",
  "EM",
  "H1",
  "H2",
  "H3",
  "H4",
  "H5",
  "H6",
  "I",
  "LI",
  "OL",
  "P",
  "S",
  "STRIKE",
  "STRONG",
  "SPAN",
  "HR",
  "U",
  "UL",
]);

const DROP_WITH_CONTENT = new Set([
  "EMBED",
  "FORM",
  "IFRAME",
  "MATH",
  "OBJECT",
  "SCRIPT",
  "STYLE",
  "SVG",
  "TEMPLATE",
]);

const SAFE_STYLE_PROPERTIES = new Set([
  "font-style",
  "font-weight",
  "text-align",
  "text-decoration",
  "break-before",
  "break-after",
  "page-break-before",
  "page-break-after",
]);

function safeHref(value) {
  const href = value.trim();
  return /^(https?:|mailto:|#|\/)/i.test(href) ? href : "";
}

function safeStyle(value) {
  return value
    .split(";")
    .map((declaration) => declaration.trim())
    .filter(Boolean)
    .map((declaration) => {
      const separator = declaration.indexOf(":");
      if (separator < 0) return "";
      const property = declaration.slice(0, separator).trim().toLowerCase();
      const propertyValue = declaration.slice(separator + 1).trim();
      if (!SAFE_STYLE_PROPERTIES.has(property) || /url\s*\(|expression\s*\(/i.test(propertyValue)) return "";
      return `${property}: ${propertyValue}`;
    })
    .filter(Boolean)
    .join("; ");
}

function sanitizeManuscriptHtml(html = "") {
  if (typeof window === "undefined" || typeof window.DOMParser === "undefined") {
    return String(html)
      .replace(/<(script|style|iframe|object|embed|svg|math|form|template)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, "")
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/javascript\s*:/gi, "");
  }

  const documentValue = new window.DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const root = documentValue.body.firstElementChild;
  if (!root) return "";

  [...root.querySelectorAll("*")].forEach((element) => {
    if (DROP_WITH_CONTENT.has(element.tagName)) {
      element.remove();
      return;
    }
    if (!ALLOWED_TAGS.has(element.tagName)) {
      element.replaceWith(...element.childNodes);
      return;
    }

    if (element.classList.contains("page-break") || element.classList.contains("pagebreak")) element.setAttribute("data-page-break", "true");
    [...element.attributes].forEach((attribute) => {
      const name = attribute.name.toLowerCase();
      if (element.tagName === "OL" && name === "start" && /^\d+$/.test(attribute.value)) return;
      if (name === "data-page-break") { element.setAttribute(name, "true"); return; }
      if (name === "style") {
        const style = safeStyle(attribute.value);
        if (style) element.setAttribute("style", style);
        else element.removeAttribute(attribute.name);
        return;
      }
      if (element.tagName === "A" && name === "href") {
        const href = safeHref(attribute.value);
        if (href) element.setAttribute("href", href);
        else element.removeAttribute(attribute.name);
        return;
      }
      element.removeAttribute(attribute.name);
    });

    if (element.tagName === "A") {
      element.setAttribute("rel", "noopener noreferrer");
    }
    // Imported editors often wrap each Hindi glyph in a font/position span.
    // Once those styles are removed, keep one shaping run rather than empty wrappers.
    if (element.tagName === "SPAN" && !element.attributes.length) {
      element.replaceWith(...element.childNodes);
    }
  });

  root.normalize();
  return root.innerHTML.replace(/(?:<br\s*\/?>(?:\s|&nbsp;)*){3,}/gi, "<br><br>");
}


const containsDevanagari = text => /[\u0900-\u097f\ua8e0-\ua8ff]/u.test(String(text || ""));

function prepareManuscriptPaste({ html = "", text = "", mode = "auto" } = {}) {
  // Plain clipboard text avoids PDF/Word spans interrupting an Indic syllable.
  // Preserve the supplied Unicode, including deliberate ZWJ/ZWNJ characters.
  const usePlain = text.length > 0 && (mode === "plain" || !html || (mode === "auto" && containsDevanagari(text)));
  if (!usePlain) return sanitizeManuscriptHtml(html);
  return String(text).replace(/\r\n?/g, "\n")
    .replace(/[&<>]/g, value => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[value]))
    .replace(/\n/g, "<br>");
}

function hasDetachedDevanagariMarks(text = "") {
  // Report clear orphan marks; never try to infer the author's intended words.
  return /(?:^|[\s\u25cc])[\u093a-\u094f\u0951-\u0957\u0962\u0963]/u.test(text) || text.includes("\ufffd");
}

  const used=pages.map(html=>{box.innerHTML=html;return box.getBoundingClientRect().height;});box.remove();
  assert(used.every((h,i)=>h<=(height-96-(i?0:heading))+.6),'No clipped text '+style.id+' '+size,used);

 }

for(const html of ['<p>First<br>Second<br><br>Third</p>','<p>First</p><div data-page-break="true"></div><p>Second</p>','<p>First<span data-page-break="true"></span>Second</p>','<p>First<br style="page-break-before:always">Second</p>']) {

const fullText=text(mixed);

const original='उसका नाम रुद्र वर्मा था।\nएक टूटी कुर्सी, एक टेबल और किताबें। क्ष त्र ज्ञ श्र क्‍ष क्‌ष';
