.print-manuscript { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 24px; overflow-wrap: anywhere; }
.manuscript-prose { overflow-wrap: anywhere; }

</style></head><body><h1>Print pagination regression</h1><pre>Running</pre><script type="module">// Measure with the same typography as the printed page. DOM ranges retain all
// inline formatting when a paragraph crosses a page boundary.
function paginateByHeight(html, pageWidth, pageHeight) {
  const box = document.createElement('div');
  box.className = 'manuscript-prose print-manuscript';
  Object.assign(box.style, { position: 'fixed', visibility: 'hidden', left: '-10000px', top: '0', width: `${pageWidth - 120}px`, height: 'auto', fontFamily: 'Georgia, "Times New Roman", serif' });
  document.body.appendChild(box);
  const source = document.createElement('div');
  source.innerHTML = html;
  // Word and contentEditable may nest explicit breaks inside a paragraph.
  let marker;
  while ((marker = [...source.querySelectorAll('[data-page-break], br[style]')].find(node => node.parentNode !== source && (node.hasAttribute('data-page-break') || /page|always/.test(node.style.breakBefore || node.style.pageBreakBefore || ''))))) {
    let block = marker; while (block.parentNode !== source) block = block.parentNode;
    const before = document.createRange(); before.selectNodeContents(block); before.setEndBefore(marker);
    const after = document.createRange(); after.selectNodeContents(block); after.setStartAfter(marker);
    const a = block.cloneNode(false); a.append(before.cloneContents());
    const b = block.cloneNode(false); b.append(after.cloneContents());
    const pageBreak = document.createElement('div'); pageBreak.setAttribute('data-page-break', 'true');
    block.replaceWith(a, pageBreak, b);
  }
  const pages = [];
  let current = [];
  const limit = pageHeight - 120;
  const output = nodes => nodes.map(n => n.outerHTML || n.textContent).join('');
  const flush = () => { if (current.length) { pages.push(output(current)); current = []; } };
  const fits = nodes => { box.replaceChildren(...nodes.map(n => n.cloneNode(true))); return box.getBoundingClientRect().height <= limit; };
  function parts(element, offset) {
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    let node; let used = 0;
    while ((node = walker.nextNode())) {
      if (used + node.length >= offset) {
        const before = document.createRange(); before.selectNodeContents(element); before.setEnd(node, offset - used);
        const after = document.createRange(); after.selectNodeContents(element); after.setStart(node, offset - used);
        const a = element.cloneNode(false); a.append(before.cloneContents());
        const b = element.cloneNode(false); b.append(after.cloneContents());
        return [a, b];
      }
      used += node.length;
    }
    return [element.cloneNode(true), null];
  }
  function append(element) {
    if (element.nodeType === Node.TEXT_NODE) { if (!element.textContent.trim()) return; const p = document.createElement('p'); p.textContent = element.textContent; element = p; }
    const before = element.style?.breakBefore || element.style?.pageBreakBefore;
    const after = element.style?.breakAfter || element.style?.pageBreakAfter;
    if (/page|always|left|right/.test(before || '') || element.hasAttribute('data-page-break')) flush();
    if (element.hasAttribute('data-page-break')) return;
    element.style?.removeProperty('break-before'); element.style?.removeProperty('page-break-before');
    element.style?.removeProperty('break-after'); element.style?.removeProperty('page-break-after');
    if (fits([...current, element])) current.push(element);
    else {
      // Keep paragraphs together whenever they fit on a fresh page.
      if (current.length && fits([element])) { flush(); current.push(element); }
      else {
        const text = element.textContent || '';
        const offsets = [...text.matchAll(/\s+/gu)].map(m => m.index + m[0].length);
        if (!offsets.length) for (let i = 1; i < text.length; i++) offsets.push(i);
        let low = 0, high = offsets.length - 1, best = -1;
        while (low <= high) { const mid = (low + high) >> 1; const [part] = parts(element, offsets[mid]); if (fits([...current, part])) { best = mid; low = mid + 1; } else high = mid - 1; }
        if (best < 0 && current.length) { flush(); append(element); return; }
        if (best >= 0 && offsets[best] < text.length) { const [a,b] = parts(element, offsets[best]); current.push(a); flush(); if (b) append(b); }
        else { current.push(element); flush(); }
      }
    }
    if (/page|always|left|right/.test(after || '')) flush();
  }
  try { [...source.childNodes].forEach(append); flush(); return pages.length ? pages : ['']; }
  finally { box.remove(); }
}

const ALLOWED_TAGS = new Set([
  "A",
  "B",
  "BLOCKQUOTE",
  "BR",
  "DIV",
  "EM",
  "H1",
  "H2",
  "H3",
  "H4",
  "H5",
  "H6",
  "I",
  "LI",
  "OL",
  "P",
  "S",
  "STRIKE",
  "STRONG",
  "SPAN",
  "HR",
  "U",
  "UL",
]);

const DROP_WITH_CONTENT = new Set([
  "EMBED",
  "FORM",
  "IFRAME",
  "MATH",
  "OBJECT",
  "SCRIPT",
  "STYLE",
  "SVG",
  "TEMPLATE",
]);

const SAFE_STYLE_PROPERTIES = new Set([
  "font-style",
  "font-weight",
  "text-align",
  "text-decoration",
  "font-size",
  "font-family",
  "line-height",
  "break-before",
  "break-after",
  "page-break-before",
  "page-break-after",
]);

function safeHref(value) {
  const href = value.trim();
  return /^(https?:|mailto:|#|\/)/i.test(href) ? href : "";
}

function safeStyle(value) {
  return value
    .split(";")
    .map((declaration) => declaration.trim())
    .filter(Boolean)
    .map((declaration) => {
      const separator = declaration.indexOf(":");
      if (separator < 0) return "";
      const property = declaration.slice(0, separator).trim().toLowerCase();
      const propertyValue = declaration.slice(separator + 1).trim();
      if (!SAFE_STYLE_PROPERTIES.has(property) || /url\s*\(|expression\s*\(/i.test(propertyValue)) return "";
      return `${property}: ${propertyValue}`;
    })
    .filter(Boolean)
    .join("; ");
}

function sanitizeManuscriptHtml(html = "") {
  if (typeof window === "undefined" || typeof window.DOMParser === "undefined") {
    return String(html)
      .replace(/<(script|style|iframe|object|embed|svg|math|form|template)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, "")
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/javascript\s*:/gi, "");
  }

  const documentValue = new window.DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const root = documentValue.body.firstElementChild;
  if (!root) return "";

  [...root.querySelectorAll("*")].forEach((element) => {
    if (DROP_WITH_CONTENT.has(element.tagName)) {
      element.remove();
      return;
    }
    if (!ALLOWED_TAGS.has(element.tagName)) {
      element.replaceWith(...element.childNodes);
      return;
    }

    if (element.classList.contains("page-break") || element.classList.contains("pagebreak")) element.setAttribute("data-page-break", "true");
    [...element.attributes].forEach((attribute) => {
      const name = attribute.name.toLowerCase();
      if (name === "data-page-break") { element.setAttribute(name, "true"); return; }
      if (name === "style") {
        const style = safeStyle(attribute.value);
        if (style) element.setAttribute("style", style);
        else element.removeAttribute(attribute.name);
        return;
      }
      if (element.tagName === "A" && name === "href") {
        const href = safeHref(attribute.value);
        if (href) element.setAttribute("href", href);
        else element.removeAttribute(attribute.name);
        return;
      }
      element.removeAttribute(attribute.name);
    });

    if (element.tagName === "A") {
      element.setAttribute("rel", "noopener noreferrer");
    }
  });

  return root.innerHTML;
}

const html='<p><strong>Bold Hindi बड़े बेटे संतकुमार </strong><em>Italic words </em><u>Underline</u></p>'+('<p>'+('Hindi कहानी paragraphs and words. '.repeat(180))+'</p>').repeat(3)+'<div data-page-break="true"></div><p>AFTER EXPLICIT BREAK</p>';
const safe=sanitizeManuscriptHtml(html);const pages=paginateByHeight(safe,600,830);const div=document.createElement('div');div.innerHTML=pages.join('');const original=document.createElement('div');original.innerHTML=safe;assert(div.textContent===original.textContent,'All text preserved across pages');assert(div.querySelector('strong')&&div.querySelector('em')&&div.querySelector('u'),'Bold italic underline preserved');assert(pages.at(-1).includes('AFTER EXPLICIT BREAK')&&!pages.at(-2).includes('AFTER EXPLICIT BREAK'),'Explicit page break starts new page');for(const page of pages){const measure=document.createElement('div');measure.className='manuscript-prose print-manuscript';measure.style.width='480px';measure.innerHTML=page;document.body.append(measure);assert(measure.getBoundingClientRect().height<=710,'Page fits within print body');measure.remove();}const nested=paginateByHeight(sanitizeManuscriptHtml('<p>FIRST<br style="page-break-before:always">SECOND</p>'),600,830);assert(nested.length===2&&nested[1].includes('SECOND'),'Nested Word page break honored');const multi=paginateByHeight(sanitizeManuscriptHtml('<p>ONE<br style=\"page-break-before:always\">TWO<br style=\"page-break-before:always\">THREE</p>'),600,830);assert(multi.length===3,'Multiple nested page breaks honored');document.querySelector('pre').textContent=JSON.stringify({passed:true,pageCount:pages.length,checks},null,2);}catch(e){document.querySelector("pre").textContent="FAILED: "+e.message;}</script></body></html>
